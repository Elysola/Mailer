name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  # Pin the toolchain: the plugin ABI is exercised against a known TinyGo
  # release, and a moving `latest` would turn version drift into flaky CI.
  TINYGO_VERSION: "0.39.0"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "run: gofmt -w ."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      # Host tests do not need TinyGo: internal/plugin/testdata holds tiny
      # hand-assembled modules so the suite stays toolchain-independent.
      - name: Go test
        run: go test -race ./...

  # Separate job so a vulnerability in a dependency reports as its own red X
  # instead of hiding inside a test failure.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck only reports vulnerabilities reachable from this code,
      # which keeps the signal usable: unreachable findings would just train
      # everyone to ignore the job.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}

      - name: Build plugins
        run: make plugins

      # A plugin that compiles can still fail to load: bad manifest, missing
      # entrypoint, invalid regex, unsupported api_version.
      - name: Validate plugin manifests and entrypoints
        run: go run . plugins validate --dir ./plugins

      - name: Smoke-test the otp plugin
        run: |
          out=$(go run . plugins test --dir ./plugins \
            --input ./plugins/sample-mail.json)
          echo "$out"
          echo "$out" | grep -q '"code": "690831"' || {
            echo "otp plugin did not extract the expected code" >&2
            exit 1
          }

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-plugins
          path: plugins/**/*.wasm
          if-no-files-found: error

  # /privacy and /terms are the public pages Google requires before an OAuth
  # consent screen can be published. A broken build there silently takes the
  # verification URL offline, so treat it as a release blocker and check that
  # the routes actually render rather than trusting the exit status alone.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: make docs-install

      - name: Build documentation
        run: make docs

      - name: Check the legal pages rendered
        run: |
          for page in privacy terms; do
            file="./docs/.vitepress/dist/$page.html"
            [ -f "$file" ] || { echo "missing $file" >&2; exit 1; }
          done

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error
