# How often to check every account for new mail (Go duration: 30s, 1m, 5m...).
poll_interval: 60s

# SQLite database used to remember which mail has already been notified.
# When running in Docker, point this at the mounted data volume, e.g.:
#   state_file: /app/data/state.db
state_file: state.db

# HTTP health check and metrics server port. Set to 0 to disable.
health_port: 9100

# Notification retry: attempts (excluding first try) and base backoff delay.
retry_attempts: 2
retry_delay: 5s

# Optional interactive "mark as read" button on notifications. Requires a bot:
# - Telegram: bot token (uses getUpdates long polling)
# - Discord: bot_token (Gateway handles button interactions; a plain webhook
#   cannot receive button clicks, the button would be inert)
read_button: false

# IMAP NOOP keepalive interval. Pooled connections send NOOP at this rate
# to prevent server-side timeouts.
noop_interval: 30s

# Optional directory containing WASM mail processors. Each plugin is a YAML
# manifest next to a .wasm file. Plugins use the versioned mailer.plugin.v1
# JSON in/out ABI and are tried by priority, highest first.
#
# A manifest may also declare `patterns` (host-evaluated RE2 regexes) whose
# captures become result fields, usable in mail_template as {{.Fields.name}}.
# Plugin results can override the title/text and narrow delivery via
# `notifiers`; all of it is persisted with the retry queue.
# plugin_dir: ./plugins
# plugin_timeout: 100ms
# plugin_max_input: 524288
# plugin_max_output: 16384

# Max characters of preview text extracted from each mail body. Any notifier
# further truncates to its own platform limit (e.g. Telegram 4096 chars).
# Can be overridden per account. Default 400.
preview_len: 400

# How long delivered Message-IDs are remembered for dedup, before the
# seen_messages table is pruned (checked about once a day). Default 90d.
seen_retention: 2160h

# Upper bound on how many failed notifications are retried per account each
# poll cycle. Failed notices retry with exponential backoff (capped at 1h)
# and are dropped after 7 days. Default 200.
max_pending_per_account: 200

# One or more IMAP mailboxes to watch. Add as many accounts as you like.
accounts:
  - name: primary                # label shown in notifications/logs
    host: imap.example.com
    port: 993                     # 993 = implicit TLS, 143 = STARTTLS
    username: me@example.com
    password: "app-password-here"
    tls: true                     # true = implicit TLS (993); false = STARTTLS (143)
    mailbox: INBOX
    mark_seen: false              # true = mark mail \Seen after notifying
    notify_existing: false        # false = only notify mail arriving after startup
    # idle: true                  # real-time: hold an IMAP IDLE session open
    #                             # and poll the instant mail arrives. Regular
    #                             # polling continues as a safety net.
    #                             # Requires server-side IDLE support.
    # preview_len: 120             # optional: override global preview length
    # notifiers: [telegram]        # optional: override global notifiers per account
    # message_template:            # optional: per-account message template
    #   title: "{{.Subject}}"
    #   text: "From: {{.From}}\n{{.Preview}}"
    # password_file: /run/secrets/imap_pass    # read password from file (age/gpg/any)
    #                                          # also supports $ENV_VAR expansion

  - name: work                    # a second account (Office 365 example)
    host: outlook.office365.com
    port: 993
    username: me@work.com
    password: "app-password"
    tls: true

  - name: gmail                   # a third account (Gmail example)
    host: imap.gmail.com
    port: 993
    username: me@gmail.com
    # Gmail disabled password/basic auth, so either an App Password (with
    # 2FA enabled) or OAuth2 works. App Password keeps `password`; OAuth2
    # replaces it with the block below. See "Gmail over OAuth2" in README.
    password: "app-password"     # App Password: 16 chars, 2FA required
    # oauth2:                     # ...or comment out `password` and use this
    #   client_id: "1234-abc.apps.googleusercontent.com"
    #   client_secret_file: /run/secrets/gmail_client_secret
    #   # written by `mailer auth gmail`; must be mode 0600
    #   token_file: /var/lib/mailer/gmail_token.json
    tls: true
    mailbox: INBOX

# Telegram push via a bot. Create a bot with @BotFather to get the token,
# then get your chat_id (e.g. message the bot and read getUpdates).
telegram:
  enabled: true
  bot_token: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyz"  # or bot_token_file
  # bot_token_file: /run/secrets/telegram_token
  chat_ids:
    - "123456789"
  # api_base: "https://api.telegram.org"   # override for a proxy if needed

# Discord push. Use EITHER a webhook_url (simplest) OR bot_token + channel_id.
discord:
  enabled: false
  webhook_url: "https://discord.com/api/webhooks/XXXX/YYYY"
  # webhook_url_file: /run/secrets/discord_webhook
  bot_token: ""
  # bot_token_file: /run/secrets/discord_token
  channel_id: ""

# Optional global message template overrides. Each field is a Go text/template
# string executed against the Message struct. Per-account templates take
# precedence when set.
# message_template:
#   title: "{{.Subject}}"
#   text: |
#     📬 New mail on {{.Account}}
#     From: {{.From}}
#     Subject: {{.Subject}}
#     {{if .Preview}}{{.Preview}}{{end}}
