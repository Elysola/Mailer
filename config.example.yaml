# ---- Routes: the single source of truth for delivery policy ------------------
# Rows are evaluated in order; every matching row contributes its notifiers
# and processors (union, deduped) until a row with `stop: true` terminates
# evaluation. A row without `when` always matches.
routes:
  # Example fast path: mails the wasm plugin tagged with an otp field go
  # straight to the personal telegram, and nothing else.
  # - name: otp-fast-path
  #   when: 'fields.otp_code != ""'
  #   to: [tg-personal]
  #   stop: true

  # Per-source routing replaces v1's per-account notifier overrides:
  # - name: work-mail
  #   when: 'source == "work"'
  #   processors: [noise-filter, wasm-plugins]
  #   to: [dc-alerts]

  # Exactly one route must match everything; the loader rejects configs
  # without one.
  - name: catch-all
    processors: [noise-filter, wasm-plugins]
    to: [tg-main]
    # per-route inline template:
    # template:
    #   title: "{{.Source}}: {{.Subject}}"
    #   body: "{{.Preview}}"

# ---- Templates: named title/body pairs referenced by routes ------------------
templates:
  default:
    title: "[{{.Source}}] {{.Subject}}"
    body: |
      {{.Preview}}
      — {{.From}}
  # work:
  #   title: "[工作] {{.Subject}}"
  #   body: "{{.Preview}}"
