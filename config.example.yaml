# config.yaml (v2) — Mailer v2 architecture
#
# Migrating from v1? Run:  mailer migrate-config -config config.yaml
# It writes config.v2.yaml next to the original, which you review and rename.
#
# Every instance below is a component: `type` selects the factory, all other
# fields belong to the component itself. Adding a new component type upstream
# never requires changes to this file's schema.
version: 2

daemon:
  # How often sources poll for new mail (Go duration: 30s, 1m, 5m...).
  poll_interval: 60s
  # HTTP health/metrics/status server port. Set to 0 to disable.
  health_port: 9100
  # Notification retry: attempts (excluding first try) and base backoff delay.
  retry_attempts: 2
  retry_delay: 5s
  # How long delivered Message-IDs are remembered for dedup.
  # Default 2160h (90d).
  seen_retention: 2160h
  # Upper bound on queued retries re-attempted per source per scan. Default 200.
  max_pending_per_source: 200

state:
  # SQLite state file. In Docker point this at the mounted volume.
  driver: sqlite
  file: state.db

# ---- Sources: mailboxes to watch -------------------------------------------
sources:
  - name: primary              # label shown in notifications, logs, routes
    type: imap
    host: imap.example.com
    port: 993                  # 993 = implicit TLS, 143 = STARTTLS
    tls: true                  # true = implicit TLS; false = STARTTLS
    username: me@example.com
    password: "app-password"   # or password_file: /run/secrets/imap_pass
    mailbox: INBOX
    mark_seen: false           # true = mark mail \Seen after delivery
    notify_existing: false     # false = only notify mail arriving after startup
    idle: true                 # real-time push via IMAP IDLE (falls back to
                               # plain polling when the server lacks support)
    preview_len: 400           # max characters of body preview

  # A second account (Office 365 example):
  # - name: work
  #   type: imap
  #   host: outlook.office365.com
  #   port: 993
  #   tls: true
  #   username: me@work.com
  #   password: "app-password"

  # Gmail with OAuth2 (see mailer auth gmail):
  # - name: gmail
  #   type: imap
  #   host: imap.gmail.com
  #   tls: true
  #   username: you@gmail.com
  #   oauth2:
  #     client_id: ${GMAIL_CLIENT_ID}
  #     client_secret_file: gmail_client_secret.json
  #     token_file: gmail_token.json

# ---- Notifiers: where notifications are delivered ---------------------------
notifiers:
  - name: tg-main
    type: telegram
    bot_token_file: /run/secrets/tg_token   # or bot_token: "123:abc"
    chat_ids: ["123456789"]
    interactive: true        # "mark as read" buttons (needs a bot token)

  - name: dc-alerts
    type: discord
    webhook_url_file: /run/secrets/dc_webhook   # or webhook_url: "https://..."
    # bot_token + channel_id enable interactive buttons and edits; a plain
    # webhook is send-only.

  # Multiple instances of the same type just work:
  # - name: tg-personal
  #   type: telegram
  #   bot_token: ${TG_PERSONAL_TOKEN}
  #   chat_ids: ["456"]

  # # ntfy — self-host friendly push (https://ntfy.sh or your own server):
  # - name: ntfy-alerts
  #   type: ntfy
  #   server: https://ntfy.sh         # or your self-hosted instance
  #   topic_file: /run/secrets/ntfy_topic   # the topic is the credential
  #   priority: 4                     # 1 min .. 5 max
  #   tags: [email, warning]
  #   # token_file: /run/secrets/ntfy_token   # bearer auth, or user/password

  # # Slack incoming webhook — the simplest Slack integration:
  # - name: slack-ops
  #   type: slack
  #   webhook_url_file: /run/secrets/slack_webhook
  #   channel: "#alerts"              # optional override
  #   username: mailer
  #   icon_emoji: ":mailbox:"

  # # Generic webhook — covers everything else (home automation, ticket
  # # systems, custom bots). The body template uses the `json` helper to
  # # keep interpolated strings safely escaped:
  # - name: homeassistant
  #   type: webhook
  #   url: https://ha.example.com/api/webhook/mail-arrived
  #   headers:
  #     Authorization: Bearer ${HA_TOKEN}
  #   body: '{"text": {{.Message.Subject | json}}}'
  #   # success_status: 200           # when the endpoint answers non-2xx

# ---- Processors: pipeline middle stages -------------------------------------
processors:
  # WASM plugins live under a directory; one `wasm` processor instance loads
  # the whole directory (see mailer plugins list/validate/test).
  - name: wasm-plugins
    type: wasm
    dir: ./plugins
    limits:                  # fallback limits; per-plugin manifests win
      timeout: 100ms
      max_input: 524288
      max_output: 16384

  # Built-in noise filter — runs before WASM/LLM so junk never bills tokens.
  - name: noise-filter
    type: filter
    rules:
      - when: 'headers["X-Spam-Flag"] == "YES"'
        action: drop
      - when: 'subject ~= "^\\[spam\\]"'
        action: drop

  # # regex — zero-dependency field extraction, replacement, shredding.
  # # First capture group wins (whole match when the pattern has none):
  # - name: otp-extract
  #   type: regex
  #   when: 'subject contains "验证" or subject contains "code"'
  #   extract:
  #     code: '(?:code|验证码)[:：\s]*(\d{4,8})'
  #   # replace:                     # body rewrite, $1 group refs allowed
  #   #   '\d{16}': "[card]"
  #   # drop_on_match: '(?i)unsubscribe'   # shred noise outright

  # # set — stamp static fields so later routes/processors can match on
  # # them; doubles as the simplest drop filter when drop: true:
  # - name: tag-work
  #   type: set
  #   when: 'account == "work"'
  #   fields: { mailbox_type: work, priority: high }

  # # template — re-render title/body mid-pipeline once extraction has
  # # filled fields (plain-text templates; use before routing):
  # - name: otp-format
  #   type: template
  #   when: 'has(fields.code)'
  #   title: "验证码 {{.Fields.code}}"
  #   body: "来自 {{.Message.From}} 的验证码：{{.Fields.code}}"

  # # AI stages reference llms: instances by name. `when` gates them at zero
  # # cost — the LLM is never called for messages that do not match.
