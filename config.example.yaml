  #   type: llmextract
  #   llm: smart
  #   when: 'fields.class == "bill"'
  #   prefix: invoice_
  #   schema:
  #     type: object
  #     properties:
  #       amount:   { type: number }
  #       currency: { type: string }
  #       due_date: { type: string }
  #       vendor:   { type: string }

  # # Run an external command per message:
  # - name: webhook-out
